name: Publish npm package

# The JavaScript client has its own version, bumped only when the client
# changes. This workflow runs on every GitHub Release (alongside release.yml,
# which publishes the gem) and publishes the client only when
# client/package.json holds a version that isn't on npm yet; otherwise it
# does nothing. Run it by hand (workflow_dispatch) to release a client change
# without a gem release.
#
# Authentication is npm trusted publishing (OIDC): no token is stored. The
# trusted publisher on npmjs.com names this repository, this workflow file
# (publish-npm.yml) and the `release` environment, so renaming any of them
# breaks publishing until the npm settings are updated too.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

defaults:
  run:
    working-directory: client

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}
          persist-credentials: false

      # Trusted publishing needs npm 11.5.1 or later, which ships with Node 24.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      # A release that doesn't change the client leaves its version alone, and
      # the rest is skipped. (The client's first version was also published by
      # hand, since a trusted publisher can only be added to a package that
      # exists.)
      - name: Check whether this version is already published
        id: published
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if npm view "@zarpay/amounts@$VERSION" version >/dev/null 2>&1; then
            echo "@zarpay/amounts@$VERSION is already on npm; nothing to publish."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install
        if: steps.published.outputs.exists == 'false'
        run: npm ci

      - name: Lint
        if: steps.published.outputs.exists == 'false'
        run: npm run lint

      - name: Format
        if: steps.published.outputs.exists == 'false'
        run: npm run format:check

      - name: Typecheck
        if: steps.published.outputs.exists == 'false'
        run: npm run typecheck

      - name: Test
        if: steps.published.outputs.exists == 'false'
        run: npm test

      - name: Build
        if: steps.published.outputs.exists == 'false'
        run: npm run build

      # The checks above already ran, so prepublishOnly is skipped rather than
      # run twice. --provenance links the package to this workflow run.
      - name: Publish to npm
        if: steps.published.outputs.exists == 'false'
        run: npm publish --access public --provenance --ignore-scripts --loglevel verbose

      # npm writes the detail of a refused publish (which OIDC claim or policy
      # it rejected) only to its debug log, which dies with the runner.
      - name: Keep npm's debug log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: npm-debug-log
          path: ~/.npm/_logs/
          retention-days: 14
