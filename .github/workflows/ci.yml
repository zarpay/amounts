name: CI

on:
  push:
    branches:
      - main
  pull_request:

defaults:
  run:
    working-directory: gem

jobs:
  core:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby-version:
          - "3.1"
          - "3.2"
          - "3.3"
          - "3.4"
          - "4.0"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby-version }}
          working-directory: gem
          bundler-cache: true
        env:
          BUNDLE_WITHOUT: active_record:development:quality

      - name: Core Minitest
        run: bundle exec rake test:core
        env:
          BUNDLE_WITHOUT: active_record:development:quality

      - name: Core RSpec
        run: bundle exec rake spec:core
        env:
          BUNDLE_WITHOUT: active_record:development:quality

  active_record:
    name: active_record (Ruby ${{ matrix.ruby-version }}, Rails ${{ matrix.rails }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby-version:
          - "3.1"
          - "3.2"
          - "3.3"
          - "3.4"
          - "4.0"
        rails:
          - "7.1"
          - "7.2"
          - "8.0"
          - "8.1"
        exclude:
          # Rails 8 requires Ruby 3.2.
          - ruby-version: "3.1"
            rails: "8.0"
          - ruby-version: "3.1"
            rails: "8.1"

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: amounts_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # One gemfile and committed lockfile per Rails version (gem/gemfiles/).
      BUNDLE_GEMFILE: ${{ github.workspace }}/gem/gemfiles/rails_${{ matrix.rails }}.gemfile
      AMOUNTS_POSTGRES_URL: postgresql://postgres:postgres@localhost:5432/amounts_test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby-version }}
          working-directory: gem
          bundler-cache: true

      - name: ActiveRecord and generator Minitest
        run: bundle exec rake test:active_record

      - name: ActiveRecord RSpec
        run: bundle exec rake spec:active_record

      - name: PostgreSQL integration
        run: bundle exec rake test:integration

  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          working-directory: gem
          bundler-cache: true
        env:
          BUNDLE_WITH: active_record:quality
          BUNDLE_WITHOUT: development

      - name: Lint
        run: bundle exec rake lint
        env:
          BUNDLE_WITH: active_record:quality
          BUNDLE_WITHOUT: development

  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # The client's tests run against a manifest the gem exported. Export it
      # again from this commit's gem and fail if it differs, so the fixture can
      # never drift from what the gem writes.
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          working-directory: gem
          bundler-cache: true
        env:
          BUNDLE_WITHOUT: active_record:development:quality

      - name: Fixture matches the gem's export
        working-directory: gem
        env:
          BUNDLE_WITHOUT: active_record:development:quality
        run: |
          bundle exec ruby -Ilib ../client/tests/fixtures/export-manifest.rb
          git diff --exit-code ../client/tests/fixtures/manifest.json

      # The client and the gem are versioned in lockstep, and one GitHub
      # Release publishes both, so their versions must never disagree.
      - name: Client version matches the gem's
        run: |
          CLIENT="$(node -p "require('./package.json').version")"
          GEM="$(ruby -e 'load "../gem/lib/amount/version.rb"; print Amount::VERSION')"
          if [ "$CLIENT" != "$GEM" ]; then
            echo "::error::client/package.json is $CLIENT but Amount::VERSION is $GEM; bump them together"
            exit 1
          fi

  demo:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: demo

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          working-directory: demo
          bundler-cache: true

      - name: Migrate test database
        run: bin/rails db:migrate RAILS_ENV=test

      - name: Run RSpec
        run: bundle exec rspec
