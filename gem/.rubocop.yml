require:
  - ./rubocop/cop/amounts/one_assertion_per_test
  - ./rubocop/cop/amounts/one_test_class_per_file
  - ./rubocop/cop/amounts/mirrored_test_path

AllCops:
  NewCops: enable
  SuggestExtensions: false
  TargetRubyVersion: 3.1
  UseCache: false
  Exclude:
    - "vendor/**/*"
    - "site/**/*"

Layout/LineLength:
  Enabled: false

Metrics/BlockLength:
  Enabled: false
  Exclude:
    - "amounts.gemspec"
    - "test/**/*"

Metrics/MethodLength:
  Enabled: false

Metrics/AbcSize:
  Enabled: false

Metrics/CyclomaticComplexity:
  Enabled: false

Metrics/PerceivedComplexity:
  Enabled: false

Metrics/ClassLength:
  Enabled: false

Style/Documentation:
  Enabled: false

Style/StringLiterals:
  Enabled: false

Style/WordArray:
  Enabled: false

Layout/HashAlignment:
  Enabled: false

Lint/AmbiguousBlockAssociation:
  Enabled: false

Lint/RedundantRequireStatement:
  Enabled: false

Naming/RescuedExceptionsVariableName:
  Enabled: false

Naming/BinaryOperatorParameterName:
  Enabled: false

Naming/MethodParameterName:
  Enabled: false

Naming/PredicateName:
  Enabled: false

Metrics/ParameterLists:
  Enabled: false

Style/IfUnlessModifier:
  Enabled: false

Style/RedundantParentheses:
  Enabled: false

Style/StringLiteralsInInterpolation:
  Enabled: false

Style/SoleNestedConditional:
  Enabled: false

Style/RedundantConstantBase:
  Enabled: false

Layout/SpaceAroundKeyword:
  Enabled: false

Gemspec/DevelopmentDependencies:
  Enabled: false

Gemspec/RequireMFA:
  Enabled: false

# Project cops (rubocop/cop/amounts/). See .claude/rules/tests.md.
Amounts/OneAssertionPerTest:
  Enabled: true
  Include:
    - "test/**/*_test.rb"
    - "spec/**/*_spec.rb"

Amounts/OneTestClassPerFile:
  Enabled: true
  Include:
    - "test/**/*_test.rb"
    - "spec/**/*_spec.rb"

Amounts/MirroredTestPath:
  Enabled: true
  Include:
    - "test/**/*_test.rb"
    - "spec/**/*_spec.rb"
  # These directories don't mirror lib/ (see .claude/rules/tests.md).
  Exclude:
    - "test/support/**/*"
    - "test/dummy/**/*"
    - "test/integration/**/*"
    - "spec/support/**/*"
